<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="leafGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E5BA72" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C69542" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <g stroke="url(#leafGold)" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main curving stem upward-right -->
    <path d="M 10,310 C 30,260 50,190 90,130 C 120,80 150,40 175,10" />
    <path d="M 90,130 C 105,100 130,70 150,50" />
    
    <!-- Large bottom acanthus leaf -->
    <path d="M 25,290 C 10,270 5,240 15,220 C 30,230 45,240 50,260 C 55,240 70,225 85,235 C 75,255 65,270 55,295" />
    <path d="M 25,255 C 35,250 45,252 50,260" />
    <path d="M 50,260 C 60,250 70,245 80,248" />

    <!-- Mid-level palm/maple leaf pointing outward -->
    <path d="M 45,210 C 25,190 20,165 30,145 C 45,155 60,165 65,185 C 70,165 90,150 110,160 C 95,180 80,195 70,220" />
    <path d="M 40,175 C 50,170 60,172 65,185" />
    <path d="M 65,185 C 80,175 95,170 105,172" />

    <!-- Delicate upper leaves -->
    <path d="M 75,140 C 60,120 60,95 75,80 C 85,90 95,105 95,120 C 105,105 120,95 135,105 C 125,120 110,135 95,145" />
    <path d="M 70,105 C 80,102 90,108 95,120" />
    <path d="M 95,120 C 110,110 120,108 130,112" />

    <!-- Top delicate sprig -->
    <path d="M 125,75 C 120,55 125,35 140,25 C 145,35 150,50 145,65 C 155,50 170,45 180,55 C 168,70 155,80 140,85" />
    <path d="M 145,45 C 160,35 170,20 175,10" />

    <!-- Delicate tendrils and curls -->
    <path d="M 60,240 C 75,225 80,205 70,195 C 60,185 50,195 55,205" />
    <path d="M 100,160 C 115,145 120,125 110,115 C 100,105 90,115 95,125" />
    <path d="M 140,95 C 155,85 160,65 150,55" />
  </g>
</svg>
