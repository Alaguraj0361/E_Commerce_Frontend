<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="archGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CD" />
      <stop offset="35%" stop-color="#E5BA72" />
      <stop offset="70%" stop-color="#C69542" />
      <stop offset="100%" stop-color="#EBC47E" />
    </linearGradient>
    <radialGradient id="archGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4E1731" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#380C22" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#240614" stop-opacity="0" />
    </radialGradient>
    <filter id="softGoldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient radial soft glow behind badge -->
  <circle cx="110" cy="100" r="88" fill="url(#archGlow)" />

  <!-- Outer Traditional Cusped Arch Frame -->
  <g stroke="url(#archGold)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGoldGlow)">
    <!-- Top-Right Quadrant -->
    <path d="M 110,22 
             C 119,34 130,42 142,42 
             C 152,42 160,50 162,60 
             C 164,72 176,82 192,100" />
    <!-- Bottom-Right Quadrant -->
    <path d="M 192,100 
             C 176,118 164,128 162,140 
             C 160,150 152,158 142,158 
             C 130,158 119,166 110,178" />
    <!-- Bottom-Left Quadrant -->
    <path d="M 110,178 
             C 101,166 90,158 78,158 
             C 68,158 60,150 58,140 
             C 56,128 44,118 28,100" />
    <!-- Top-Left Quadrant -->
    <path d="M 28,100 
             C 44,82 56,72 58,60 
             C 60,50 68,42 78,42 
             C 90,42 101,34 110,22" />
  </g>

  <!-- Delicate Inner Contour -->
  <g stroke="url(#archGold)" stroke-width="1.1" stroke-opacity="0.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 110,28 
             C 118,38 128,45 139,45 
             C 148,45 155,52 157,61 
             C 159,71 169,80 184,100
             C 169,120 159,129 157,139 
             C 155,148 148,155 139,155 
             C 128,155 118,162 110,172
             C 102,162 92,155 81,155 
             C 72,155 65,148 63,139 
             C 61,129 51,120 36,100
             C 51,80 61,71 63,61 
             C 65,52 72,45 81,45 
             C 92,45 102,38 110,28" />
  </g>

  <!-- 4 Symmetrical Fleur-de-lis / Lotus Finials -->
  <!-- Top Finial -->
  <g transform="translate(110, 20)" fill="url(#archGold)" stroke="url(#archGold)" stroke-width="0.5">
    <path d="M 0,-14 C -2,-8 -4,-4 0,0 C 4,-4 2,-8 0,-14 Z" />
    <path d="M 0,-3 C -4,-6 -8,-6 -6,-1 C -4,2 0,0 0,0 Z" />
    <path d="M 0,-3 C 4,-6 8,-6 6,-1 C 4,2 0,0 0,0 Z" />
    <circle cx="0" cy="0" r="1.5" />
    <circle cx="0" cy="-15" r="1.8" />
  </g>
  <!-- Bottom Finial -->
  <g transform="translate(110, 180) rotate(180)" fill="url(#archGold)" stroke="url(#archGold)" stroke-width="0.5">
    <path d="M 0,-14 C -2,-8 -4,-4 0,0 C 4,-4 2,-8 0,-14 Z" />
    <path d="M 0,-3 C -4,-6 -8,-6 -6,-1 C -4,2 0,0 0,0 Z" />
    <path d="M 0,-3 C 4,-6 8,-6 6,-1 C 4,2 0,0 0,0 Z" />
    <circle cx="0" cy="0" r="1.5" />
    <circle cx="0" cy="-15" r="1.8" />
  </g>
  <!-- Right Finial -->
  <g transform="translate(194, 100) rotate(90)" fill="url(#archGold)" stroke="url(#archGold)" stroke-width="0.5">
    <path d="M 0,-14 C -2,-8 -4,-4 0,0 C 4,-4 2,-8 0,-14 Z" />
    <path d="M 0,-3 C -4,-6 -8,-6 -6,-1 C -4,2 0,0 0,0 Z" />
    <path d="M 0,-3 C 4,-6 8,-6 6,-1 C 4,2 0,0 0,0 Z" />
    <circle cx="0" cy="0" r="1.5" />
    <circle cx="0" cy="-15" r="1.8" />
  </g>
  <!-- Left Finial -->
  <g transform="translate(26, 100) rotate(-90)" fill="url(#archGold)" stroke="url(#archGold)" stroke-width="0.5">
    <path d="M 0,-14 C -2,-8 -4,-4 0,0 C 4,-4 2,-8 0,-14 Z" />
    <path d="M 0,-3 C -4,-6 -8,-6 -6,-1 C -4,2 0,0 0,0 Z" />
    <path d="M 0,-3 C 4,-6 8,-6 6,-1 C 4,2 0,0 0,0 Z" />
    <circle cx="0" cy="0" r="1.5" />
    <circle cx="0" cy="-15" r="1.8" />
  </g>

  <!-- Typography Inside Badge: 20% OFF in Luxury Serif -->
  <text x="110" y="98" text-anchor="middle" fill="url(#archGold)" font-family="serif, 'Playfair Display', Georgia" font-size="48" font-weight="600" letter-spacing="-0.02em">20%</text>
  <text x="110" y="132" text-anchor="middle" fill="url(#archGold)" font-family="serif, 'Playfair Display', Georgia" font-size="22" font-weight="600" letter-spacing="0.18em">OFF</text>
</svg>
